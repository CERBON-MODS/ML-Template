plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.7-SNAPSHOT" apply false
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id 'net.darkhax.curseforgegradle' version '1.1.18'
    id "com.modrinth.minotaur" version "2.+"
}

architectury {
    minecraft = minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "com.github.johnrengelman.shadow"
    apply plugin: "net.darkhax.curseforgegradle"
    apply plugin: "com.modrinth.minotaur"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"

        modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${mapping_version}@zip")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    version = mod_version
    group = maven_group

    repositories {
        maven {
            name "ParchmentMC"
            url "https://maven.parchmentmc.org"
        }
        maven {
            name "CurseMaven"
            url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            name "NeoForge"
            url "https://maven.neoforged.net/releases/"
        }
        maven {
            name "Jared's maven" // JEI
            url "https://maven.blamejared.com/"
        }
        maven {
            name "ModMaven" // JEI
            url "https://modmaven.dev"
        }
        maven {
            name "ModMenu"
            url "https://maven.terraformersmc.com/"
        }
        maven {
            name "Ladysnake Mods" // Cardinal Components
            url "https://maven.ladysnake.org/releases"
        }
        flatDir {
            dir "libs"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding "UTF-8"
        options.release.set(Integer.getInteger(java_version))
    }

    java {
        withSourcesJar()
    }
}

tasks.register("publishAllCurseforgeAndModrinth", Task) {
    dependsOn ":forge:publishCurseForgeAndModrinth"
    dependsOn ":fabric:publishCurseForgeAndModrinth"
    dependsOn ":neoforge:publishCurseForgeAndModrinth"
}
